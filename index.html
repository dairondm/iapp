<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuraciones clave para iPhone / Web App -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PipCalc">
    <title>Calculadora de Pips</title>
    
    <style>
        /* Estilos inspirados en iOS */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            color: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-top: 40px; /* Espacio para el notch del iPhone */
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: 600;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #3a3a3c;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 16px; /* 16px evita que Safari haga zoom automático al tocar */
            box-sizing: border-box;
            margin-bottom: 16px;
            background-color: #fafafa;
            -webkit-appearance: none;
        }
        button {
            width: 100%;
            background-color: #007aff;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            background-color: #005bb5;
        }
        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #e5f1ff;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .result-title {
            font-size: 14px;
            color: #007aff;
            margin-bottom: 4px;
        }
        .result-value {
            font-size: 28px;
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Valor del Pip</h1>

        <label for="pairType">Tipo de Par de Divisas</label>
        <select id="pairType">
            <option value="standard">Pares Estándar (ej. EUR/USD, GBP/USD)</option>
            <option value="jpy">Pares con JPY (ej. USD/JPY, EUR/JPY)</option>
        </select>

        <label for="lotSize">Tamaño de la Posición (Unidades)</label>
        <input type="number" id="lotSize" placeholder="ej. 100000 para 1 lote" value="100000" inputmode="numeric">

        <label for="exchangeRate">Tipo de Cambio Actual (Opcional)*</label>
        <input type="number" id="exchangeRate" placeholder="ej. 1.0850" step="0.0001" inputmode="decimal">

        <button onclick="calculatePip()">Calcular</button>

        <div class="result-box" id="resultBox">
            <div class="result-title">Valor de 1 Pip:</div>
            <div class="result-value" id="resultValue">$0.00</div>
            <div style="font-size: 12px; color: #666; margin-top: 8px;" id="resultNote"></div>
        </div>
    </div>

    <script>
        function calculatePip() {
            const pairType = document.getElementById('pairType').value;
            const lotSize = parseFloat(document.getElementById('lotSize').value);
            const exchangeRate = parseFloat(document.getElementById('exchangeRate').value);
            
            if (isNaN(lotSize) || lotSize <= 0) {
                alert("Por favor ingresa un tamaño de posición válido.");
                return;
            }

            let pipSize = (pairType === 'jpy') ? 0.01 : 0.0001;
            let pipValue = 0;
            let currency = "Unidades Base";

            // Calculo básico: (Tamaño del pip / Tipo de cambio) * Tamaño de posición
            if (!isNaN(exchangeRate) && exchangeRate > 0) {
                pipValue = (pipSize / exchangeRate) * lotSize;
                currency = "USD (aprox)";
                document.getElementById('resultNote').innerText = "Calculado usando el tipo de cambio proporcionado.";
            } else {
                // Si no dan tipo de cambio, calculamos en la moneda cotizada (la segunda del par)
                pipValue = pipSize * lotSize;
                currency = "Moneda Cotizada";
                document.getElementById('resultNote').innerText = "*Valor expresado en la moneda secundaria del par. Ingresa el tipo de cambio para mayor precisión.";
            }

            document.getElementById('resultValue').innerText = pipValue.toFixed(2) + ' ' + currency;
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
